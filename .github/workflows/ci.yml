name: CI

# Every job below runs `scripts/ci-local.sh <job>` after its own setup and
# nothing else (CI8). The step list lives in that script so the owner and every
# session run exactly what CI runs: from 2026-07-31 CI sat red for 82 days while
# every local gate was green, because the two ran different commands. Add a
# check to the script, never only here.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC. Pushes here are rare, so without this a runner
    # image, Xcode or Homebrew change can break the build unseen for months.
    # GitHub mails a scheduled failure to whoever last edited this cron line.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  design-tokens:
    name: Design tokens (TECH-DSN3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The font-size check diffs against the push's or pull request's base.
          fetch-depth: 0
      - name: Design-token fences
        env:
          # Empty on a scheduled or manual run, which skips the diff-based check.
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-local.sh design-tokens

  truth-fences:
    name: Truth fences (CI5)
    # Diffs what the docs SAY against what the code DOES. Whole-state, not
    # diff-based, on purpose: both failure classes go wrong by omission, which a
    # diff never shows. Known drift sits in the script's allowlists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # tomllib is stdlib from 3.11; the script needs no other dependency.
          python-version: "3.12"
      - name: Config keys, event categories, CLAUDE.md budgets, doc links
        run: bash scripts/ci-local.sh truth-fences

  pipeline:
    name: Pipeline (pytest)
    # Pure-Python tests, run on Linux, installed from uv.lock (CI8).
    runs-on: ubuntu-latest
    env:
      # The runner's system Python is newer than 3.11 and inside requires-python,
      # so without this uv would pick it rather than the interpreter the lock and
      # pyright's pythonVersion assume.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Lint, typecheck, test from the lock
        run: bash scripts/ci-local.sh pipeline

  daemon:
    name: Daemon (swift build + test)
    # macos-15: its default Xcode ships a Swift 6 toolchain, required to
    # resolve the FluidAudio package (its Package.swift declares
    # swift-tools-version 6.0).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Install ffmpeg
        # The MuteRedactor data-safety tests shell out to ffmpeg to verify the
        # mute-redaction path over a real WAV. GitHub's macOS image ships none,
        # so without this the tests would silently skip.
        run: |
          brew install ffmpeg
          ffmpeg -version | head -1
      - name: Build, test, and the engine bounds under a one-thread pool
        run: bash scripts/ci-local.sh daemon
